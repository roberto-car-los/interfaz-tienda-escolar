</head>
<body>
    <div class="contenedor">
      <h1>Formulario de compra</h1>
      <div class="formulario">
        <label>Nombre:</label>
        <input type="text" placeholder="Escribe tu Nombre">

        <label>Dirección:</label>
        <input type="text" placeholder="Escribe tu Dirección">

        <label>Correo:</label>
        <input type="mail" placeholder="Escribe tu correo">

        <label>Forma de pago:</label>
        <input type="text" placeholder="Escribe la forma de pago (efectivo o transferencia)">

        <button onclick="window.location.href='producto.html'">Aceptar</button>
        <button onclick="window.location.href='index.html'">Volver</button>
      </div>
      
   </div>
